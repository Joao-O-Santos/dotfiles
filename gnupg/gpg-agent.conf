# Tracked dotfiles configuration; linked to ~/.gnupg/gpg-agent.conf.
# This file contains settings only. Keys and other GnuPG state stay local.

# Use a separate GTK dialog for GPG signing and SSH authentication.
pinentry-program /usr/bin/pinentry-gtk

# Cache a successfully entered GPG passphrase for up to 9.6 hours.
default-cache-ttl 34560
max-cache-ttl 34560

# Serve SSH authentication through gpg-agent. Cache SSH key passphrases for
# up to 12 hours; the maximum is a hard limit even when a key is used again.
enable-ssh-support
default-cache-ttl-ssh 43200
max-cache-ttl-ssh 43200
