# Test case: R data wrangling
# Adapted from tests/r-coder-exercises/01-wrangle.md
id: r-wrangle
skill_under_test: r-analysis-quarto
skills_loaded: [r-analysis-quarto]
description: "Wrangle a dataset: filter, mutate, select, arrange"
tags: [r, coding, data]

setup:
  fixtures:
    "raw_data.csv": ./fixtures/raw_data.csv

prompt: |
  Read raw_data.csv and wrangle it:
  1. Filter rows where condition == "experimental"
  2. Create a new column z_score = (value - mean(value)) / sd(value)
  3. Select only id, condition, z_score columns
  4. Arrange by descending z_score

checks:
  - kind: shell
    description: "Script runs without errors"
    command: "Rscript wrangle.R 2>&1"
    expect_regex: ""  # No error output

  - kind: jq_path_contains
    description: "Output has correct columns"
    file: "output.csv"
    path: "$.columns"
    expect: ["id", "condition", "z_score"]

  - kind: output_contains
    description: "Uses ds naming pattern"
    expect: "ds"

  - kind: output_contains
    description: "Uses matches() not coi pattern"
    expect: "matches("

  - kind: output_contains
    description: "First function takes ds as argument"
    expect: "filter(ds"

  - kind: output_not_contains
    description: "Does not use coi pattern"
    expect: "coi"

manual:
  - Tabs for indentation
  - Lines ≤ 80 characters
  - Sparse comments
  - Follows coding_style.md
