# Test case: Empirical introduction
# Adapted from tests/writing-exercises/01-intro-empirical.md
id: intro-empirical
skill_under_test: intro
skills_loaded: [intro, writing-craft, manuscript-workflow]
description: "Write an introduction for a study on children's perceived competence in a social cognition task"
tags: [writing, intro, empirical]

prompt: |
  Write an introduction for a study investigating whether children
  are perceived as less competent than adults in a social cognition
  task. The study uses a between-participants design with 120
  participants. Use the intro skill.

checks:
  # Structural checks
  - kind: output_contains
    description: "Hook is present"
    expect: "hook"  # The intro must have an engaging opening
    # Manual check — requires human or LLM judge

  - kind: output_contains
    description: "Literature context present"
    expect: "cite"  # Citations should be present

  - kind: output_contains
    description: "Gap identified"
    expect: "however"  # Gap signal word (approximate)

  - kind: output_contains
    description: "Research question stated"
    expect: "hypothes"  # Hypothesis or research question

  # Workflow checks
  - kind: output_contains
    description: "Writer loaded intro skill"
    expect: "intro"

  - kind: output_contains
    description: "Writer loaded writing-craft"
    expect: "writing-craft"

  - kind: output_not_contains
    description: "Planner did not draft itself"
    expect: "<!-- TODO"  # No unresolved TODOs suggesting planner shortcut

# Manual criteria (for human or LLM judge review)
manual:
  - Hook is concrete (not generic)
  - Literature context includes 2-3 relevant findings
  - Gap is clearly identified
  - Hypothesis is testable
  - Hard-wrapped to 72 chars
  - Hamburger paragraphs (topic sentence → evidence → link)
  - No fabricated citations
