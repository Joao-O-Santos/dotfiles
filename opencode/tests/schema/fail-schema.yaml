# FAIL Schema for test results
# Adopted from eval-harness (github.com/nano-step/eval-harness)
#
# Every failed check produces a record with these 6 fields:
#
#   failed_check_id:  Stable grep-able identifier (e.g., "output_contains:hook")
#   expected:         What the case asserted
#   actual:           What the agent actually produced
#   diff_hint:        One-sentence gap narrowing
#   transcript_span:  Line range in agent output (optional)
#   attribution:      What changed since last passing run

fields:
  - name: failed_check_id
    type: string
    description: "Stable identifier for this check, e.g. 'output_contains:intro.hook'"
    required: true
  - name: expected
    type: string
    description: "What the test case asserted should happen"
    required: true
  - name: actual
    type: string
    description: "What the agent actually produced"
    required: true
  - name: diff_hint
    type: string
    description: "One-sentence narrowing of the gap between expected and actual"
    required: true
  - name: transcript_span
    type: object
    description: "Line range in agent transcript where the issue occurred"
    required: false
    fields:
      - start_line: integer
      - end_line: integer
  - name: attribution
    type: object
    description: "What changed since the last passing baseline"
    required: false
    fields:
      - top: string  # SKILL_CHANGED | CODE_CHANGED | PROMPT_CHANGED | ENV_CHANGED | UNKNOWN
      - skill_sha: string
      - code_sha: string

# Attribution classes:
#   SKILL_CHANGED  — A skill file was modified
#   CODE_CHANGED   — Supporting code (R scripts, shell scripts) changed
#   PROMPT_CHANGED — The test prompt itself changed
#   ENV_CHANGED    — Environment (model, opencode version) changed
#   UNKNOWN        — No identifiable cause
