# Test Case Schema
# Defines the structure of a test case YAML file
fields:
  id:
    type: string
    description: "Unique test case identifier"
    required: true
  skill_under_test:
    type: string
    description: "Primary skill being tested"
    required: true
  skills_loaded:
    type: array
    description: "All skills that should be loaded"
    required: false
  description:
    type: string
    description: "What this test case exercises"
    required: true
  tags:
    type: array
    description: "Tags for filtering (e.g., [writing, intro])"
    required: false
  setup:
    type: object
    description: "Pre-run setup (fixtures, environment)"
    required: false
  prompt:
    type: string
    description: "Natural-language instruction sent to the agent"
    required: true
  budget:
    type: object
    description: "Resource caps"
    required: false
    fields:
      max_tokens: integer
      max_seconds: integer
  checks:
    type: array
    description: "List of assertions to verify"
    required: true
    items:
      kind: string  # shell | file_exists | output_contains | output_not_contains | llm_judge
      description: string
      # kind-specific fields below
  manual:
    type: array
    description: "Criteria requiring human or LLM judgment"
    required: false
